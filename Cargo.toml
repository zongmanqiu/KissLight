[package]
name = "kisslight"
version = "1.1.0"
edition = "2021"
description = "轻量 Windows 夜间模式控制器（Rust + 原生 Win32）"
license = "AGPL-3.0-only"
authors = ["邱宗满 <qiuzongman@foxmail.com>"]
repository = "https://gitee.com/qiuzongman/kiss-light"
readme = "README.md"
keywords = ["windows", "nightlight", "color-temperature", "win32"]
categories = ["command-line-utilities", "os::windows-apis"]

[[bin]]
name = "KissLight"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"

[dependencies]
png = "0.17"
anyhow = "1.0"
# 夜间模式核心：本地 path 依赖（源码在项目根 .3rd/，见 AGENTS.md）
win-nightlight-lib = { path = "../.3rd/win-nightlight-cli-0.5.0/win-nightlight-lib" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
